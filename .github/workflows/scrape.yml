name: Daily MCF Ghost Job Audit

on:
  schedule:
    # Runs daily at midnight UTC (which is 8:00 AM Singapore time)
    - cron: '0 0 * * *' 
  workflow_dispatch: # Allows you to manually click a button to run it

permissions:
  contents: write # Required so the action can push the updated DB back to the repo

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper & AI Audit
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scraper.py
          
      - name: Commit Updated DB
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add mcf_jobs.db
          # The '|| echo' prevents the workflow from failing if no new jobs were found today
          git commit -m "Automated daily compliance check" || echo "No changes to commit"
          git push